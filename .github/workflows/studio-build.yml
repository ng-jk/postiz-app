name: Studio fork image
on:
  workflow_dispatch:
  push:
    branches: [studio]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: true
          platforms: linux/amd64
          tags: ghcr.io/ng-jk/postiz-app:studio-${{ github.sha }}
          build-args: NEXT_PUBLIC_VERSION=studio-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
